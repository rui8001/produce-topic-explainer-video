name: Bug report
description: Report a reproducible problem in the Skill or its documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, private media, account data, or client information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did you ask the Skill to do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: safe-repro
    attributes:
      label: Safe reproduction
      description: Provide a synthetic or redistributable example only.
