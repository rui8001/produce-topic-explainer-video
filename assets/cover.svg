<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Produce Topic Explainer Video</title>
  <desc id="desc">A purple and orange cover showing a topic becoming evidence, a model, and a vertical video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17112b"/>
      <stop offset="0.58" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" rx="40" fill="url(#bg)"/>
  <circle cx="1065" cy="92" r="190" fill="#fb923c" opacity=".12"/>
  <circle cx="160" cy="580" r="230" fill="#a78bfa" opacity=".11"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#fff">
    <text x="72" y="112" font-size="25" font-weight="700" letter-spacing="4" fill="#fdba74">CODEX SKILL · TOPIC TO VIDEO</text>
    <text x="72" y="202" font-size="64" font-weight="800">给一个选题，做成一条</text>
    <text x="72" y="286" font-size="64" font-weight="800">讲得清、证据真的知识视频</text>
    <text x="74" y="342" font-size="25" fill="#e9d5ff">研究 · 口播 · 连续配音 · 统一视觉 · 样片 · 逐帧质检</text>
  </g>
  <g transform="translate(80 414)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
    <rect width="238" height="118" rx="24" fill="#fff" opacity=".96"/>
    <text x="24" y="43" fill="#4c1d95" font-size="18" font-weight="700">TOPIC</text>
    <text x="24" y="82" fill="#17112b" font-size="25" font-weight="800">一个任意选题</text>
    <path d="M254 59h45" stroke="#fdba74" stroke-width="8" stroke-linecap="round"/>
    <path d="m290 45 18 14-18 14" fill="none" stroke="#fdba74" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="324" width="238" height="118" rx="24" fill="#fff" opacity=".96"/>
    <text x="348" y="43" fill="#4c1d95" font-size="18" font-weight="700">EVIDENCE + MODEL</text>
    <text x="348" y="82" fill="#17112b" font-size="25" font-weight="800">可信证据与解释</text>
    <path d="M578 59h45" stroke="#fdba74" stroke-width="8" stroke-linecap="round"/>
    <path d="m614 45 18 14-18 14" fill="none" stroke="#fdba74" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="648" width="364" height="118" rx="24" fill="#fff" opacity=".96"/>
    <rect x="676" y="22" width="45" height="75" rx="10" fill="#7c3aed"/>
    <circle cx="698.5" cy="84" r="4" fill="#fdba74"/>
    <text x="747" y="48" fill="#4c1d95" font-size="18" font-weight="700">VERTICAL EXPLAINER</text>
    <text x="747" y="84" fill="#17112b" font-size="25" font-weight="800">可交付的完整视频</text>
  </g>
</svg>
